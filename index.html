<link rel="manifest" href="manifest.json">
<style>
:root{--p:#05C0BF;--pd:#04908f;--pl:#e1f8f8;--bg:#f3fafa;--card:#fff;--tx:#0d2b2b;--mut:#5f7b7b;--line:#d9ecec;--err:#d64545;--sh:0 1px 2px rgba(5,60,60,.06),0 8px 24px rgba(5,60,60,.06);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--pl:#0f2b2b;--bg:#081414;--card:#102020;--tx:#e6f5f5;--mut:#8fb0b0;--line:#1c3535;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);min-height:100dvh;font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.hide{display:none!important}
.logo{width:40px;height:40px;object-fit:contain}
/* login */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 26px;box-shadow:var(--sh);text-align:center}
.lbox .logo{width:76px;height:76px;margin-bottom:10px}
.lbox h1{font-size:26px;letter-spacing:-.02em}
.lbox p{color:var(--mut);margin:4px 0 22px}
.fld{display:block;text-align:left;margin-bottom:14px}
.fld span{font-size:13px;color:var(--mut);display:block;margin-bottom:5px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,textarea:focus{outline:2px solid var(--p);border-color:transparent}
.btn{background:var(--p);color:#fff;font-weight:700;border-radius:12px;padding:12px 18px;width:100%}
.btn:hover{background:var(--pd)}
.btn.ghost{background:var(--pl);color:var(--pd)}
.btn.danger{background:none;color:var(--err);border:1px solid var(--line)}
.btn[disabled]{opacity:.6}
.err{color:var(--err);font-size:13px;min-height:20px;margin-bottom:8px}
/* shell */
#app{min-height:100dvh}
#side{display:none}
main{padding:18px 18px calc(110px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-top:env(safe-area-inset-top)}
.top .logo{width:34px;height:34px}
.top b{font-size:18px}
.demo{margin-left:auto;background:var(--pl);color:var(--pd);font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px}
h2{font-size:24px;letter-spacing:-.02em}
.sub{color:var(--mut);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{padding:14px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat small{color:var(--mut)}
.grid2{display:grid;gap:12px}
.card h3{font-size:15px;margin-bottom:10px}
.leg{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.donut{display:flex;align-items:center;gap:18px}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.ic{width:42px;height:42px;border-radius:12px;background:var(--pl);color:var(--pd);display:grid;place-items:center;flex:none}
.ic svg{width:21px;height:21px}
.it .m{flex:1;min-width:0}
.it .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .act{display:flex;gap:4px}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.ib:hover{background:var(--pl);color:var(--pd)}
.ib svg{width:18px;height:18px}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.srch{margin-bottom:12px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.set small{color:var(--mut);display:block}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--p)}.sw.on::after{left:23px}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
#bar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 0}
#bar svg{width:23px;height:23px}
#bar button.on{color:var(--p);font-weight:700}
#bar .add{position:relative}
#bar .add span{width:54px;height:54px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(5,192,191,.45);border:4px solid var(--card)}
#bar .add svg{width:26px;height:26px}
#bar .add small{display:none}
/* modal & toast */
#ov{position:fixed;inset:0;background:rgba(5,30,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.sheet{position:relative}.sheet h3{font-size:18px;margin-bottom:14px;padding-right:40px}
.sheet.wide{max-width:860px}
.dli{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;flex:none}.dli:hover{background:var(--pl)}.fc{touch-action:manipulation}
.xb{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;font-size:24px;line-height:1;color:var(--mut);display:grid;place-items:center}.xb:hover{background:var(--pl);color:var(--pd)}
.row{display:flex;gap:10px;margin-top:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;text-align:left}
.opt:hover{border-color:var(--p);background:var(--pl)}
.opt small{color:var(--mut);display:block}
textarea{min-height:200px;resize:vertical}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60}
.dsep{text-align:center;color:var(--mut);font-size:12px;margin:14px 0 8px}
.bub{display:flex;margin-bottom:8px}
.bb{margin-left:auto;max-width:min(560px,86%);background:var(--pl);border:1px solid var(--line);border-radius:18px 18px 6px 18px;padding:10px 14px;word-break:break-word}
.bb p{white-space:pre-wrap}.bb>b{display:block;margin-bottom:2px}
.bb .tm{display:flex;align-items:center;justify-content:flex-end;gap:4px;color:var(--mut);font-size:11px;margin-top:4px}
.bb .tm .ib{width:26px;height:26px}.bb .tm .ib svg{width:15px;height:15px}
.tag{background:var(--card);border:1px solid var(--line);color:var(--pd);border-radius:99px;padding:0 8px;margin-right:auto;font-size:11px}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}.crow:last-child{border:0}.crow:hover{background:var(--pl)}.crow .m{flex:1;min-width:0}
.av{width:48px;height:48px;border-radius:50%;background:var(--pl);color:var(--pd);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;border:1px solid var(--line)}.av.sm{width:40px;height:40px;font-size:16px}.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}.av.lg{width:68px;height:68px;font-size:26px}.fph{display:flex;align-items:center;gap:14px;margin-bottom:14px}.fph .fpa{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px}.rt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt small{color:var(--mut);flex:none}
.pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:14px}.bd{background:var(--p);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 6px;flex:none}
.fh{flex:1;min-width:0}.fh b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fh small{color:var(--mut)}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:14px}
.fcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--sh)}
.fcard:hover{border-color:var(--p)}.fcard .m{flex:1;min-width:0}.fcard b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fcard small{color:var(--mut)}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.fhead h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid{display:flex;align-items:center;gap:4px}.kid .fc{flex:1}
.fc{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;margin-top:6px;color:var(--pd)}
.fc svg{width:20px;height:20px;flex:none}.fc span{flex:1;min-width:0}
.fc b,.fc small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}.fc small{color:var(--mut)}
.comp{position:fixed;z-index:15;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--sh)}
.cr{display:flex;align-items:flex-end;gap:6px}
.cr textarea{min-height:42px;max-height:140px;resize:none;border-radius:14px;padding:10px 12px}
.send{width:42px;height:42px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.pc{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 8px}
.pc span{background:var(--pl);color:var(--pd);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;display:flex;align-items:center;gap:4px}
.pc button{width:20px;height:20px;border-radius:50%;color:var(--pd);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mut);background:var(--card)}
.chips button.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
@media(min-width:900px){
 #bar{display:none}
 #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--card);border-right:1px solid var(--line);padding:22px 16px;gap:6px}
 #side .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin-bottom:18px;padding:0 6px}
 #side .addb{background:var(--p);color:#fff;font-weight:700;border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
 #side .addb:hover{background:var(--pd)}
 #side .addb svg{width:20px;height:20px}
 #side .nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mut);font-weight:600;text-align:left}
 #side .nv svg{width:20px;height:20px}
 #side .nv:hover{background:var(--pl)}
 #side .nv.on{background:var(--pl);color:var(--pd)}
 main{margin-left:240px;max-width:none;padding:32px 40px 40px}
 main>div{max-width:980px}
 .top{display:none}
 .stats{gap:14px}.stat{padding:18px}.stat b{font-size:26px}
 .grid2{grid-template-columns:1.4fr 1fr;gap:14px}
 .list.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 #ov{align-items:center}.sheet{border-radius:22px}
 #toast{bottom:28px}.comp{bottom:16px;left:280px;right:40px;max-width:940px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const fs=files;closeSheet();
  try{let pid;
   if(x){await updateDoc(doc(col(),x.id),{title:x.type==="file"?(t||x.name):t,text:tx,editedAt:Date.now()});pid=x.id}
   else pid=(await addDoc(col(),{type:"note",title:t,text:tx,createdAt:Date.now()})).id;
   if(fs.length){for(const f of fs)await upload(f,"","",pid)}else toast("Disimpan")
  }catch(e){toast("Gagal menyimpan.")}};
 if(x)$("#nd").onclick=()=>{closeSheet();remove(x.id)}}
const CH=900000,MAXC=30*1048576;
/* IndexedDB: salinan berkas di perangkat, jadi buka/unduh ulang tidak membaca Firestore lagi */
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open("essenwa",1);r.onupgradeneeded=()=>r.result.createObjectStore("a");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const itx=async(m,f)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction("a",m),q=f(t.objectStore("a"));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)})};
const iPut=(k,v)=>itx("readwrite",s=>s.put(v,k)).catch(()=>{}),iGet=k=>itx("readonly",s=>s.get(k)).catch(()=>null),iDel=k=>itx("readwrite",s=>s.delete(k)).catch(()=>{});
const ik=id=>(S.user?S.user.uid:"")+"/"+id;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const hint=c=>c==="permission-denied"?"Rules Firestore belum benar.":c==="resource-exhausted"?"Kuota harian Firestore gratis habis, coba lagi besok.":"";
async function shrink(f){let blob=f,name=f.name,mime=f.type||"application/octet-stream",enc="raw";
 if(/^image\/(jpeg|png|webp|bmp)$/.test(mime)){
  try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
   c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
   const o=await new Promise(r=>c.toBlob(r,"image/webp",.72));
   if(o&&o.size<f.size){blob=o;mime=o.type;name=name.replace(/\.[^.]+$/,"")+(o.type==="image/webp"?".webp":".png")}}catch(e){}
 }else if(window.CompressionStream&&!/^(image|video|audio)\//.test(mime)&&!/pdf|zip|gzip|officedocument|compressed/.test(mime)){
  try{const g=await new Response(f.stream().pipeThrough(new CompressionStream("gzip"))).blob();if(g.size<f.size*.95){blob=g;enc="gz"}}catch(e){}}
 return{blob,name,mime,enc}}
async function dropChunks(id){try{const q=await getDocs(collection(db,"users",S.user.uid,"items",id,"chunks"));await Promise.all(q.docs.map(d=>deleteDoc(d.ref)))}catch(e){}}
async function upload(f,t="",tx="",parent="",folder=""){
 const uid=S.user.uid,r0=doc(col()),id=r0.id;
 try{
  if(!navigator.onLine)return toast("Upload butuh koneksi internet.",4000);
  if(f.size>MAXC*4)return toast("Berkas terlalu besar (maks ±30 MB setelah dikompres): "+f.name,5000);
  toast("Memproses "+f.name+"...",8000);
  const p=await shrink(f);
  if(p.blob.size>MAXC)return toast("Berkas terlalu besar (maks ±30 MB setelah dikompres): "+f.name,5000);
  const n=Math.ceil(p.blob.size/CH)||1;
  for(let i=0;i<n;i++){
   toast(`Menyimpan ${f.name} ${Math.round(i/n*100)}%`,8000);
   const buf=new Uint8Array(await p.blob.slice(i*CH,(i+1)*CH).arrayBuffer());
   await setDoc(doc(db,"users",uid,"items",id,"chunks",String(i).padStart(4,"0")),{i,d:Bytes.fromUint8Array(buf)});
  }
  await setDoc(r0,{type:"file",name:p.name,title:t||p.name,text:tx,mime:p.mime,size:p.blob.size,orig:f.size,enc:p.enc,chunks:n,bin:1,createdAt:Date.now(),...(parent?{parent}:{}),...(folder?{folder}:{})});
  await iPut(uid+"/"+id,p.blob);
  toast(`Tersimpan: ${p.name} (${fmt(f.size)} → ${fmt(p.blob.size)})`,4000)
 }catch(e){
  await dropChunks(id);
  const c=(e.code||"")+(e.message||"");
  toast(/permission|insufficient/i.test(c)?"Ditolak Firestore: perbarui rules dulu.":"Gagal menyimpan "+f.name+". "+(hint(e.code)||"Coba lagi."),6000)}}
async function getBlob(x){
 if(x.chunks){
  const cached=await iGet(ik(x.id));
  if(cached)return cached;
  const q=await getDocs(collection(db,"users",S.user.uid,"items",x.id,"chunks"));
  const parts=q.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i).map(d=>typeof d.d==="string"?Uint8Array.from(atob(d.d),c=>c.charCodeAt(0)):d.d.toUint8Array());
  if(parts.length<x.chunks)throw new Error("bagian berkas hilang");
  let blob=new Blob(parts,{type:x.mime});
  if(x.enc==="gz")blob=new Blob([await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).blob()],{type:x.mime});
  iPut(ik(x.id),blob);
  return blob}
 if(x.inline)return await(await fetch(x.inline)).blob();
 return null}
async function download(id){const x=S.items.find(i=>i.id===id);if(!x)return;
 try{toast("Menyiapkan berkas...",6000);const blob=await getBlob(x);if(!blob)return;
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=x.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4)
 }catch(e){toast("Gagal membuka berkas.")}}
function fileTap(e,id){clearTimeout(S.pt);if(e.detail>=2)return download(id);S.pt=setTimeout(()=>preview(id),260)}
async function preview(id){const x=S.items.find(i=>i.id===id);if(!x)return;
 sheet(`<h3>${esc(x.name)}</h3><div id="pvb" class="empty">Memuat...</div><div class="row"><button class="btn" id="pd">Unduh</button></div>`,"wide");
 $("#pd").onclick=()=>download(id);
 try{const b=await getBlob(x),el=$("#pvb");if(!b||!el)return;
  const m=x.mime||b.type||"",u=URL.createObjectURL(b);S.pu=u;let h;
  if(m.startsWith("image/"))h=`<img src="${u}" alt="" style="max-width:100%;max-height:65dvh;display:block;margin:0 auto;border-radius:12px">`;
  else if(m==="application/pdf")h=`<iframe src="${u}" style="width:100%;height:65dvh;border:1px solid var(--line);border-radius:12px"></iframe>`;
  else if(m.startsWith("video/"))h=`<video src="${u}" controls style="max-width:100%;max-height:65dvh"></video>`;
  else if(m.startsWith("audio/"))h=`<audio src="${u}" controls style="width:100%"></audio>`;
  else if(/^text\/|json|csv|xml/.test(m)){const t=await b.text();h=`<pre style="white-space:pre-wrap;max-height:60dvh;overflow:auto;background:var(--bg);padding:12px;border-radius:12px;font-size:13px">${esc(t.slice(0,20000))}</pre>`}
  else h='<div class="empty">Pratinjau tidak tersedia untuk jenis berkas ini. Tekan Unduh.</div>';
  el.className="";el.innerHTML=h
 }catch(e){const el=$("#pvb");if(el)el.textContent="Gagal memuat pratinjau."}}
async function delItem(x){if(x.chunks)await dropChunks(x.id);await deleteDoc(doc(col(),x.id));iDel(ik(x.id))}
function remove(id){const x=S.items.find(i=>i.id===id);if(!x)return;
 sheet(`<h3>Hapus ${x.type==="file"?"berkas":"catatan"}?</h3><p class="sub">${esc(x.name||x.title||"Item ini")} akan dihapus permanen.</p><div class="row"><button class="btn ghost" id="c1">Batal</button><button class="btn" id="c2" style="background:var(--err)">Hapus</button></div>`);
 $("#c1").onclick=closeSheet;
 $("#c2").onclick=async()=>{try{for(const k of S.items.filter(k=>k.parent===id))await delItem(k);await delItem(x);closeSheet();toast("Dihapus")}catch(e){toast("Gagal menghapus.")}}}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
</script>
